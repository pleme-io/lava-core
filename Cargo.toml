[package]
authors = ["pleme-io"]
description = "Typed primitive layer for the lava suite. Tatara-lisp + Rust DSL frontend for magma. Brazilian-Portuguese for the substance magma flows as. Sits on pleme-io/magma as the tatara equivalent of pangea-core."
edition = "2024"
license = "MIT"
name = "lava-core"
readme = "README.md"
repository = "https://github.com/pleme-io/lava-core"
version = "0.1.7"

[lib]
name = "lava_core"
path = "src/lib.rs"

[lints.clippy]
pedantic = "warn"

[dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: serde_json::Map becomes insertion-ordered (IndexMap) rather
# than a BTreeMap. Without it `Value::into_json` re-sorts every map
# alphabetically, which silently falsifies the byte-stability guarantee
# `Architecture::render_terraform_json` claims for itself.
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
